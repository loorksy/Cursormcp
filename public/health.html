<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0b1017" />
  <title>صحة الخدمة — MCP Cursor Bridge</title>
  <link rel="stylesheet" href="/styles.css?v=ui3" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>MCP Cursor Bridge</h1>
          <div class="muted">صفحة الصحة العامة</div>
        </div>
      </div>
      <div class="top-actions">
        <a href="/login">تسجيل الدخول</a>
      </div>
    </div>
  </header>
  <div class="wrap">
    <div class="card">
      <p class="kicker">مراقبة</p>
      <h1>حالة الخدمة</h1>
      <p class="muted">صفحة عامة للتأكد أن الجسر يعمل. لا تتضمن أسرارًا.</p>
      <pre id="out" class="health-json">جاري التحميل…</pre>
    </div>
  </div>
  <script>
    fetch("/health", { headers: { Accept: "application/json" } })
      .then((r) => r.json())
      .then((data) => {
        document.getElementById("out").textContent = JSON.stringify(data, null, 2);
      })
      .catch((err) => {
        document.getElementById("out").textContent = "فشل التحميل: " + err.message;
      });
  </script>
</body>
</html>
