services:
  api:
    build: .
    command: node src/server.js
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DISABLE_POLLER: "true"
    ports:
      - "18800:18800"
    volumes:
      - bridge-data:/app/data
      - bridge-logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18800/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build: .
    command: node src/worker.js
    env_file: .env
    environment:
      HOST: 0.0.0.0
    volumes:
      - bridge-data:/app/data
      - bridge-logs:/app/logs
    depends_on:
      api:
        condition: service_healthy

volumes:
  bridge-data:
  bridge-logs:
